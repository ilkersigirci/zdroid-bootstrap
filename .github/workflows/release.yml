name: Release

# Pushing an annotated `v*` tag runs the tests, then builds
# bootstrap-aarch64.zip from the pinned base and this repository's patches/
# and publishes it as that tag's release, with the tag's message as the
# release notes. Zdroid installs the latest release, so only a tested one
# may become it.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Dylanmurzello/zdroid-bootstrap's v2026.05.06-r4. The zip build.sh was
      # first run on, and the termux-packages build behind it, aren't
      # published, so the last release stands in for it: build.sh only
      # overlays patches/ and rewrites paths, so running it again on its own
      # output is harmless. If that release disappears, use one of ours.
      BASE_URL: https://github.com/Dylanmurzello/zdroid-bootstrap/releases/download/v2026.05.06-r4/bootstrap-aarch64.zip
      BASE_SHA256: dc6d53260b1a4ff6bbca7ab36bee37a32ff40d619981cf6ec418544d757912b7
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the base
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/base.zip" "$BASE_URL"
          echo "$BASE_SHA256  $RUNNER_TEMP/base.zip" | sha256sum --check

      - name: Build
        run: ./build.sh "$RUNNER_TEMP/base.zip" "$RUNNER_TEMP/bootstrap-aarch64.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # actions/checkout fetches the tag as a lightweight one, which
          # loses its message.
          git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          sha256sum "$RUNNER_TEMP/bootstrap-aarch64.zip"
          gh release create "$TAG" "$RUNNER_TEMP/bootstrap-aarch64.zip" \
            --title "$TAG" --notes-from-tag --verify-tag
